name: Update mechanical engineering news

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mechanical-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and translate current RSS articles
        run: python tools/update_mechanical_news.py
      - name: Commit updated feed
        run: |
          if git diff --quiet -- www/data/mechanical-news.json; then
            echo "No new articles to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/data/mechanical-news.json
          git commit -m "chore: update mechanical news"
          git push

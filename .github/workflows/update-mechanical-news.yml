name: Update Persian Mechanical Engineering News

on:
  schedule:
    # Run every 24 hours at 17:00 UTC (20:30 Iran time)
    - cron: "0 17 * * *"
  workflow_dispatch:
    # Allow manual triggering from GitHub UI

permissions:
  contents: write

concurrency:
  group: mechanical-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Display Python version
        run: python --version

      - name: Fetch Persian tech news (Zoomit, Digiato)
        run: |
          echo "=========================================="
          echo "Starting Persian tech news update"
          echo "=========================================="
          python tools/update_mechanical_news.py
          echo "=========================================="
          echo "News update script completed"
          echo "=========================================="
        env:
          PYTHONUNBUFFERED: 1
          TZ: UTC

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- www/data/mechanical-news.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new articles to commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in mechanical-news.json"
          fi

      - name: Commit and push updated feed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/data/mechanical-news.json
          git diff --cached --stat
          git commit -m "chore: update Persian tech news feed

          - Fetched latest articles from Zoomit and Digiato (Persian RSS)
          - Updated www/data/mechanical-news.json

          Generated with GitHub Actions"
          git push

      - name: Update summary
        if: always()
        run: |
          echo "=========================================="
          echo "Workflow completed"
          echo "=========================================="
          if [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
            echo "✓ News feed was updated and committed"
          else
            echo "ℹ No changes detected in news feed"
          fi

name: Update Persian Mechanical Engineering News

on:
  schedule:
    # Every 6 hours at minute 17 UTC (00:17, 06:17, 12:17, 18:17).
    # Non-zero minute reduces scheduling delays on GitHub Actions default slots.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    # Allow manual triggering from GitHub UI (Actions tab -> Run workflow)

permissions:
  contents: write

concurrency:
  group: mechanical-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # NOTE: do NOT use "cache: pip" here — the repo has no dependency
          # manifest (requirements.txt / pyproject.toml), so setup-python's
          # pip cache lookup fails the job before the news script even runs.
          python-version: "3.12"

      - name: Display Python version
        run: python --version

      - name: Fetch Persian tech news (Zoomit, Digiato)
        run: |
          echo "=========================================="
          echo "Starting Persian tech news update"
          echo "=========================================="
          python tools/update_mechanical_news.py
          echo "=========================================="
          echo "News update script completed"
          echo "=========================================="
        env:
          PYTHONUNBUFFERED: 1
          TZ: UTC

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- www/data/mechanical-news.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new articles to commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in mechanical-news.json"
          fi

      - name: Commit and push updated feed
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/data/mechanical-news.json
          git diff --cached --stat
          git commit -m "chore: update Persian tech news feed" \
            -m "- Fetched latest articles from Zoomit and Digiato (Persian RSS)" \
            -m "Generated with GitHub Actions"
          # Absorb any commits that landed on origin after checkout so the
          # push stays linear and never fails silently on a stale branch.
          git fetch origin
          git rebase "origin/${{ github.ref_name }}" --autostash
          git push origin "${{ github.ref_name }}"

      - name: Report failure (visible annotation)
        if: failure()
        run: |
          echo "::error::Mechanical-news workflow FAILED. Inspect the failing step logs above; fix the issue, then re-run manually from the Actions tab (workflow_dispatch)."
          echo "=========================================="
          echo "❌ WORKFLOW FAILED — job status: ${{ job.status }}"
          echo "This failure is visible in the Actions UI; the workflow did not silently stop."
          echo "=========================================="

      - name: Update summary
        if: always()
        run: |
          echo "=========================================="
          echo "Workflow finished — job status: ${{ job.status }}"
          echo "=========================================="
          if [ "${{ job.status }}" == "failure" ]; then
            echo "❌ The workflow FAILED (see the failing step and the 'Report failure' step above)."
          elif [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
            echo "✓ News feed was updated, committed and pushed"
          else
            echo "ℹ Update ran successfully; no new articles to commit"
          fi

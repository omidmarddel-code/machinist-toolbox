<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Android Preview 412</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050810;
    overflow: hidden;
  }

  .phone {
    width: 412px;
    height: 900px;
    background: #000;
    border-radius: 46px;
    padding: 11px;
    border: 1px solid rgba(148, 163, 184, .35);
    box-shadow: 0 0 0 2px #1e293b, 0 30px 80px rgba(0, 0, 0, .7);
    position: relative;
    transform-origin: center center;
  }

  .phone::before {
    content: "";
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 24px;
    background: #000;
    border-radius: 0 0 15px 15px;
    z-index: 5;
  }

  .screen {
    width: 100%;
    height: 100%;
    border-radius: 34px;
    overflow: hidden;
    background: #050810;
  }

  .screen iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #050810;
  }
</style>
</head>

<body>
  <div class="phone" id="phone">
    <div class="screen">
      <iframe id="appFrame" src="www/index.html?mobile=preview" title="Android app"></iframe>
    </div>
  </div>
  <script>
    (function () {
      'use strict';

      // پیش‌فرض: 412 x 900 (Galaxy) — قاب گوشی طوری کوچک می‌شود که در پنجره جا شود
      var W = 412, H = 900;
      var phone = document.getElementById('phone');
      var frame = document.getElementById('appFrame');
      var retried = false;

      function fit() {
        var scale = Math.min(
          1,
          (window.innerHeight - 20) / H,
          (window.innerWidth - 20) / W
        );
        phone.style.transform = 'scale(' + scale + ')';
      }

      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();

      // اگر اپ داخل قاب لود نشد، فقط یک بار خودکار رفرش می‌شود
      frame.addEventListener('load', function () {
        if (retried) return;
        try {
          if (frame.contentDocument && frame.contentDocument.documentElement.innerHTML.length > 500) return;
        } catch (e) {
          return; // دسترسی به محتوا در حالت file:// بسته است؛ یعنی صفحه لود شده
        }
        retried = true;
        frame.src = 'www/index.html?mobile=preview&_r=' + Date.now();
      });
    })();
  </script>
</body>
</html>
